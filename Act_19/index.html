<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <title>Act_19</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Formulario de registro:</h1>

    <form class="formulario-registro" novalidate>

        <!-- Radios ocultos para controlar qué paso es el que se muestra -->
        <input type="radio" name="paso" id="paso-1" class="control-paso" checked>
        <input type="radio" name="paso" id="paso-2" class="control-paso">

        <!-- Paso 1(datos personales) -->
        <section class="paso paso-uno">
        <h2>Paso 1 de 2 — Datos personales</h2>

        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required minlength="3">
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <label for="paso-2" class="boton boton-siguiente">Siguiente</label>
        </section>

        <!-- Paso 2(mensaje y contacto) -->
        <section class="paso paso-dos">
        <h2>Paso 2 de 2 — Tu mensaje</h2>

        <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{6,15}">
        </div>

        <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" required minlength="10"></textarea>
        </div>

        <div class="acciones">
            <label for="paso-1" class="boton boton-atras">Atrás</label>
            <button type="submit" class="boton boton-enviar">Enviar</button>
        </div>
        </section>

    </form>
        
</body>


</html>
